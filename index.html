<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRapid | Security Audit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .ripple-circle {
            position: absolute;
            border-radius: 50%;
            background: #3b82f6;
            animation: ripple 2s infinite ease-out;
        }
        .ripple-2 { animation-delay: 0.5s; }
        .ripple-3 { animation-delay: 1s; }
    </style>
</head>
<body class="bg-slate-950 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black min-h-screen font-sans text-slate-100 selection:bg-blue-500/30">

    <div class="flex items-center justify-center min-h-screen px-6 py-12">
        <div class="w-full max-w-2xl">
            
            <div class="mb-10 text-center">
                <h1 class="text-4xl font-black tracking-tight text-white mb-3">WebRapid WebCheck<span class="text-red-500">.</span></h1>
            </div>

            <div id="inputSection" class="bg-slate-900/50 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl p-8 md:p-12 transition-all duration-500">
                <div class="space-y-6">
                    <div class="relative">
                        <input 
                            type="text" 
                            id="domainInput" 
                            placeholder="example.com"
                            class="w-full px-6 py-5 bg-black/40 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition text-xl placeholder:text-slate-600 text-white"
                        >
                    </div>
                    
                    <button 
                        id="auditButton"
                        onclick="runAudit()"
                        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-5 rounded-xl transition duration-300 transform active:scale-[0.98] shadow-lg shadow-blue-900/20"
                    >
                        Initialize Audit
                    </button>
                </div>
            </div>

            <div id="loadingSection" class="hidden bg-slate-900/50 backdrop-blur-xl border border-white/10 rounded-2xl p-20 text-center">
                <div class="flex flex-col items-center justify-center">
                    <div class="relative w-20 h-20 mb-10 flex items-center justify-center">
                        <div class="ripple-circle w-full h-full"></div>
                        <div class="ripple-circle ripple-2 w-full h-full"></div>
                        <div class="ripple-circle ripple-3 w-full h-full"></div>
                        <div class="relative z-10 w-10 h-10 bg-blue-600 rounded-full shadow-[0_0_20px_rgba(59,130,246,0.5)]"></div>
                    </div>
                    <p class="text-lg font-bold text-slate-300 tracking-widest uppercase animate-pulse">Analyzing Protocols</p>
                </div>
            </div>

            <div id="resultsSection" class="hidden bg-slate-900/50 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl p-8 md:p-12">
                
                <div id="scoreCard" class="mb-10 p-8 rounded-2xl border border-white/5 text-center transition-colors duration-700">
                    <h2 class="text-xs font-bold text-slate-500 uppercase tracking-widest mb-4">Security Integrity Score</h2>
                    <div class="flex items-baseline justify-center">
                        <span id="scoreValue" class="text-8xl font-black tracking-tighter"></span>
                        <span class="text-2xl text-slate-500 font-bold ml-2">/100</span>
                    </div>
                </div>

                <div class="mb-10">
                    <h3 class="text-sm font-bold text-slate-400 mb-6 uppercase tracking-widest flex items-center">
                        <span class="w-8 h-[1px] bg-slate-700 mr-3"></span>
                        Audit Findings
                    </h3>
                    <div id="vulnerabilitiesList" class="space-y-4">
                        </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <button 
                        onclick="resetUI()"
                        class="w-full bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold py-4 rounded-xl transition"
                    >
                        New Scan
                    </button>
                    <a 
                        id="hardeningButton"
                        class="hidden flex items-center justify-center w-full bg-white hover:bg-slate-200 text-black font-bold py-4 rounded-xl transition shadow-xl"
                    >
                        Hardening Guide
                    </a>
                </div>
            </div>

            <div id="errorSection" class="hidden bg-red-950/20 backdrop-blur-xl border border-red-500/20 rounded-2xl p-12 text-center">
                <div class="text-red-500 text-4xl mb-4">✕</div>
                <h3 class="text-xl font-bold text-white mb-2">Audit Interrupted</h3>
                <p id="errorMessage" class="text-slate-400 mb-8"></p>
                <button 
                    onclick="resetUI()"
                    class="px-8 py-3 bg-slate-800 hover:bg-slate-700 text-white rounded-lg transition"
                >
                    Return
                </button>
            </div>

        </div>
    </div>

    <script>
        const inputEl = document.getElementById('domainInput');
        
        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') runAudit();
        });

        async function runAudit() {
            let domain = inputEl.value.trim();
            if (!domain) return;

            domain = domain.replace(/^https?:\/\//, '').split('/')[0];

            document.getElementById('inputSection').classList.add('hidden');
            document.getElementById('errorSection').classList.add('hidden');
            document.getElementById('loadingSection').classList.remove('hidden');

            try {
                const response = await fetch(`/api/index?domain=${encodeURIComponent(domain)}`);
                const data = await response.json();

                if (data.error) throw new Error(data.error);
                renderResults(data, domain);
            } catch (error) {
                document.getElementById('errorMessage').innerText = error.message;
                document.getElementById('loadingSection').classList.add('hidden');
                document.getElementById('errorSection').classList.remove('hidden');
            }
        }

        function renderResults(data, domain) {
            const score = data.score;
            const vulns = data.vulnerabilities;
            const scoreCard = document.getElementById('scoreCard');
            const scoreValue = document.getElementById('scoreValue');
            
            scoreValue.innerText = score;
            scoreCard.className = 'mb-10 p-8 rounded-2xl border text-center transition-all duration-700';
            
            if (score >= 80) {
                scoreCard.classList.add('border-green-500/30', 'bg-green-500/5');
                scoreValue.classList.add('text-green-400');
            } else if (score >= 50) {
                scoreCard.classList.add('border-orange-500/30', 'bg-orange-500/5');
                scoreValue.classList.add('text-orange-400');
            } else {
                scoreCard.classList.add('border-red-500/30', 'bg-red-500/5');
                scoreValue.classList.add('text-red-400');
            }

            const listEl = document.getElementById('vulnerabilitiesList');
            listEl.innerHTML = '';
            
            if (vulns.length === 0) {
                listEl.innerHTML = '<div class="p-6 bg-green-500/10 border border-green-500/20 text-green-400 rounded-xl font-medium flex items-center">✔ All core protocols verified.</div>';
            } else {
                vulns.forEach(v => {
                    listEl.innerHTML += `
                        <div class="p-6 bg-white/5 border border-white/10 rounded-xl hover:border-white/20 transition group">
                            <h4 class="font-bold text-red-400 mb-1 group-hover:text-red-300 transition tracking-tight">${v.name}</h4>
                            <p class="text-sm text-slate-400 leading-relaxed">${v.description}</p>
                        </div>
                    `;
                });
            }

            const btn = document.getElementById('hardeningButton');
if (score < 100) {
    const subject = encodeURIComponent(`WebShield Security Report: ${domain}`);
    // A structured body helps you stay organized
    const body = encodeURIComponent(
        `WEB SHIELD AUDIT REPORT\n` +
        `----------------------\n` +
        `Domain: ${domain}\n` +
        `Security Score: ${score}/100\n\n` +
        `Issues Identified:\n${vulns.map(v => `- [ ] ${v.name}`).join('\n')}\n\n` +
        `I would like to request a professional DNS & Security hardening for this domain. Please let me know the next steps.`
    );
    
    btn.href = `mailto:webrapid.apps@gmail.com?subject=${subject}&body=${body}`;
    btn.innerText = "Fix These Issues Now"; // More action-oriented
    btn.classList.remove('hidden');
}else {
    // 2. SUCCESS / CLIPBOARD MODE
    btn.removeAttribute('href');
    btn.innerText = "Copy Result to Clipboard 📋";
    btn.className = "block w-full text-center bg-indigo-600 hover:bg-indigo-500 text-white font-bold py-4 rounded-xl transition shadow-xl cursor-pointer";
    btn.classList.remove('hidden');
    
    btn.onclick = (e) => {
        e.preventDefault();
        const shareText = `🛡️ WebShield Scan: ${domain} scored 100/100! All security headers verified.`;
        
        navigator.clipboard.writeText(shareText).then(() => {
            const originalText = btn.innerText;
            btn.innerText = "Copied! Paste on Social Media to Share your score";
            btn.classList.replace('bg-indigo-600', 'bg-green-600');
            
            // Revert button after 3 seconds
            setTimeout(() => {
                btn.innerText = originalText;
                btn.classList.replace('bg-green-600', 'bg-indigo-600');
            }, 3000);
        });
    };
}

        function resetUI() {
            document.getElementById('resultsSection').classList.add('hidden');
            document.getElementById('errorSection').classList.add('hidden');
            document.getElementById('inputSection').classList.remove('hidden');
            inputEl.value = '';
            inputEl.focus();
        }
    </script>
</body>
</html>
