<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebRapid | Security Audit</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen font-sans text-slate-900">
    <div class="flex items-center justify-center min-h-screen px-4 py-8">
        <div class="w-full max-w-xl">
            
            <!-- Input Section -->
            <div id="inputSection" class="bg-white rounded-xl shadow-2xl p-8 md:p-10 transition-all duration-300">
                <div class="mb-8 text-center">
                    <h1 class="text-3xl font-extrabold text-slate-900 mb-2">Security Audit</h1>
                    <p class="text-slate-500">Scan any domain for basic vulnerabilities</p>
                </div>
                
                <div class="space-y-4">
                    <div>
                        <input 
                            type="text" 
                            id="domainInput" 
                            placeholder="e.g., example.ie"
                            class="w-full px-4 py-4 bg-slate-50 border border-slate-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 transition text-lg"
                        >
                    </div>
                    
                    <button 
                        id="auditButton"
                        onclick="runAudit()"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-lg transition duration-200"
                    >
                        Run Audit
                    </button>
                </div>
            </div>

            <!-- Loading Section -->
            <div id="loadingSection" class="hidden bg-white rounded-xl shadow-2xl p-12 text-center">
                <div class="flex flex-col items-center justify-center space-y-6">
                    <div class="relative w-16 h-16">
                        <div class="absolute inset-0 bg-blue-500 rounded-full animate-ping opacity-75"></div>
                        <div class="absolute inset-2 bg-blue-600 rounded-full"></div>
                    </div>
                    <p class="text-xl font-semibold text-slate-700">Scanning domain...</p>
                </div>
            </div>

            <!-- Results Section -->
            <div id="resultsSection" class="hidden bg-white rounded-xl shadow-2xl p-8 md:p-10">
                
                <!-- Score Card -->
                <div id="scoreCard" class="mb-8 p-6 rounded-xl border-2 text-center">
                    <h2 class="text-sm font-bold text-slate-500 uppercase tracking-wider mb-2">Security Score</h2>
                    <div class="flex items-baseline justify-center space-x-1">
                        <span id="scoreValue" class="text-6xl font-black"></span>
                        <span class="text-2xl text-slate-400 font-bold">/100</span>
                    </div>
                </div>

                <!-- Vulnerabilities List -->
                <div class="mb-8">
                    <h3 class="text-lg font-bold text-slate-900 mb-4 border-b pb-2">Audit Findings</h3>
                    <div id="vulnerabilitiesList" class="space-y-3">
                        <!-- Injected via JS -->
                    </div>
                </div>

                <!-- Actions -->
                <div class="space-y-3">
                    <a 
                        id="hardeningButton"
                        class="hidden block w-full text-center bg-slate-900 hover:bg-black text-white font-bold py-4 rounded-lg transition"
                    >
                        Request Security Hardening
                    </a>
                    <button 
                        onclick="resetUI()"
                        class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-4 rounded-lg transition"
                    >
                        Scan Another Domain
                    </button>
                </div>
            </div>

            <!-- Error Section -->
            <div id="errorSection" class="hidden bg-white rounded-xl shadow-2xl p-8 text-center">
                <div class="text-red-500 text-5xl mb-4">⚠</div>
                <h3 class="text-xl font-bold text-red-600 mb-2">Audit Failed</h3>
                <p id="errorMessage" class="text-slate-600 mb-6"></p>
                <button 
                    onclick="resetUI()"
                    class="w-full bg-slate-100 hover:bg-slate-200 text-slate-700 font-bold py-3 rounded-lg transition"
                >
                    Try Again
                </button>
            </div>

        </div>
    </div>

    <script>
        const inputEl = document.getElementById('domainInput');
        
        // Trigger on Enter key
        inputEl.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') runAudit();
        });

        async function runAudit() {
            let domain = inputEl.value.trim();
            if (!domain) return alert('Please enter a domain');

            // Clean input if user pasted full URL
            domain = domain.replace(/^https?:\/\//, '').split('/')[0];

            // Switch to Loading UI
            document.getElementById('inputSection').classList.add('hidden');
            document.getElementById('errorSection').classList.add('hidden');
            document.getElementById('loadingSection').classList.remove('hidden');

            try {
                // Call the Vercel Python Backend
                const response = await fetch(`/api/index?domain=${encodeURIComponent(domain)}`);
                const text = await response.text();
                console.log(text);
                alert(text);

                if (data.error) throw new Error(data.error);

                renderResults(data, domain);
            } catch (error) {
                document.getElementById('errorMessage').innerText = error.message || "Could not connect to the server.";
                document.getElementById('loadingSection').classList.add('hidden');
                document.getElementById('errorSection').classList.remove('hidden');
            }
        }

        function renderResults(data, domain) {
            const score = data.score;
            const vulns = data.vulnerabilities;

            // Update Score Color
            const scoreCard = document.getElementById('scoreCard');
            const scoreValue = document.getElementById('scoreValue');
            
            scoreValue.innerText = score;
            scoreCard.className = 'mb-8 p-6 rounded-xl border-2 text-center'; // Reset classes
            
            if (score >= 80) {
                scoreCard.classList.add('border-green-200', 'bg-green-50');
                scoreValue.classList.add('text-green-600');
            } else if (score >= 50) {
                scoreCard.classList.add('border-orange-200', 'bg-orange-50');
                scoreValue.classList.add('text-orange-500');
            } else {
                scoreCard.classList.add('border-red-200', 'bg-red-50');
                scoreValue.classList.add('text-red-600');
            }

            // Render Vulnerabilities
            const listEl = document.getElementById('vulnerabilitiesList');
            listEl.innerHTML = '';
            
            if (vulns.length === 0) {
                listEl.innerHTML = '<div class="p-4 bg-green-50 text-green-700 rounded-lg font-medium">✅ No major vulnerabilities detected.</div>';
            } else {
                vulns.forEach(v => {
                    listEl.innerHTML += `
                        <div class="p-4 bg-slate-50 border border-slate-200 rounded-lg">
                            <h4 class="font-bold text-red-600 mb-1">✕ ${v.name}</h4>
                            <p class="text-sm text-slate-600">${v.description}</p>
                        </div>
                    `;
                });
            }

            // Render Hardening Button (Only if score is less than 100)
            const btn = document.getElementById('hardeningButton');
if (score < 100) {
    // This creates a link that opens the user's email app
    const subject = encodeURIComponent(`Security Hardening Request for ${domain}`);
    const body = encodeURIComponent(`Hello,\n\nI ran a security audit on ${domain} and received a score of ${score}/100. I would like to request professional assistance in fixing the following issues:\n\n- ${vulns.map(v => v.name).join('\n- ')}`);
    
    btn.href = `mailto: webrapid.apps@gmail.com?subject=${subject}&body=${body}`;
    btn.classList.remove('hidden');
} else {
    btn.classList.add('hidden');
}
            // Switch to Results UI
            document.getElementById('loadingSection').classList.add('hidden');
            document.getElementById('resultsSection').classList.remove('hidden');
        }

        function resetUI() {
            document.getElementById('resultsSection').classList.add('hidden');
            document.getElementById('errorSection').classList.add('hidden');
            document.getElementById('inputSection').classList.remove('hidden');
            inputEl.value = '';
            inputEl.focus();
        }
    </script>
</body>
</html>
