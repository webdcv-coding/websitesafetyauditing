<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WebShield | Security Audit</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @keyframes ripple {
            0% { transform: scale(1); opacity: 0.4; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        .ripple-circle {
            position: absolute;
            border-radius: 50%;
            background: #3b82f6;
            animation: ripple 2s infinite ease-out;
        }
        .ripple-2 { animation-delay: 0.5s; }
        .ripple-3 { animation-delay: 1s; }
    </style>
</head>
<body class="bg-slate-950 bg-[radial-gradient(circle_at_top_right,_var(--tw-gradient-stops))] from-slate-900 via-slate-950 to-black min-h-screen font-sans text-slate-100 selection:bg-blue-500/30">

    <div class="flex flex-col items-center justify-center min-h-screen px-6 py-12">
        <div class="w-full max-w-2xl">
            
            <div class="mb-10 text-center">
                <h1 class="text-4xl font-black tracking-tight text-white mb-3 italic uppercase">
                    WebShield<span class="text-blue-500 not-italic">.</span>
                </h1>
                <div class="inline-flex items-center px-3 py-1 rounded-full bg-blue-500/10 border border-blue-500/20">
                    <span class="w-2 h-2 rounded-full bg-blue-500 animate-pulse mr-2"></span>
                    <p class="text-[10px] text-blue-400 font-bold uppercase tracking-widest">Security Header Scanner</p>
                </div>
            </div>

            <div id="inputSection" class="bg-slate-900/50 backdrop-blur-xl border border-white/10 rounded-2xl shadow-2xl p-8 md:p-12 transition-all duration-500">
                <div class="space-y-6">
                    <div class="relative">
                        <input 
                            type="text" 
                            id="domainInput" 
                            placeholder="example.com"
                            class="w-full px-6 py-5 bg-black/40 border border-slate-700 rounded-xl focus:outline-none focus:ring-2 focus:ring-blue-600 focus:border-transparent transition text-xl placeholder:text-slate-600 text-white"
                        >
                    </div>
                    
                    <button 
                        id="auditButton"
                        onclick="runAudit()"
                        class="w-full bg-blue-600 hover:bg-blue-500 text-white font-bold py-5 rounded-xl transition duration-300 transform active:scale-[0.98] shadow-lg shadow-blue-900/20"
                    >
                        Initialize Audit
                    </button>
                </div>
            </div>

            <div id="loadingSection" class="hidden bg-slate-900/50 backdrop-blur-xl border border-white/10 rounded-2xl p-20 text-center">
                <div class="flex flex-col items-center justify-center">
                    <div class="relative w-20
