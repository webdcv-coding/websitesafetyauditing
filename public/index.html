<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Security Audit Tool</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen">
    <div class="flex items-center justify-center min-h-screen px-4 py-8">
        <div class="w-full max-w-2xl">
            <!-- Input Section -->
            <div id="inputSection" class="bg-white rounded-lg shadow-2xl p-8 md:p-12">
                <div class="mb-2">
                    <h1 class="text-3xl md:text-4xl font-bold text-slate-900 mb-2">Security Audit</h1>
                    <p class="text-slate-600">Analyze your domain for security vulnerabilities</p>
                </div>
                
                <div class="mt-8 space-y-4">
                    <div>
                        <label for="domainInput" class="block text-sm font-medium text-slate-700 mb-2">Domain</label>
                        <input 
                            type="text" 
                            id="domainInput" 
                            placeholder="example.com"
                            class="w-full px-4 py-3 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition"
                        >
                    </div>
                    
                    <button 
                        id="auditButton"
                        onclick="runAudit()"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200 ease-in-out transform hover:scale-105 active:scale-95"
                    >
                        Run Audit
                    </button>
                </div>
            </div>

            <!-- Loading Section -->
            <div id="loadingSection" class="hidden bg-white rounded-lg shadow-2xl p-8 md:p-12">
                <div class="flex flex-col items-center justify-center space-y-4">
                    <div class="relative w-12 h-12">
                        <div class="absolute inset-0 bg-blue-500 rounded-full animate-pulse"></div>
                        <div class="absolute inset-1 bg-white rounded-full"></div>
                    </div>
                    <p class="text-lg font-semibold text-slate-700">Scanning...</p>
                </div>
            </div>

            <!-- Results Section -->
            <div id="resultsSection" class="hidden bg-white rounded-lg shadow-2xl p-8 md:p-12">
                <!-- Score Card -->
                <div id="scoreCard" class="mb-8 p-6 rounded-lg border-2">
                    <div class="flex items-center justify-between mb-2">
                        <h2 class="text-sm font-semibold text-slate-600 uppercase tracking-wide">Security Score</h2>
                        <button 
                            onclick="goBack()"
                            class="text-sm text-blue-600 hover:text-blue-700 font-medium"
                        >
                            ← New Audit
                        </button>
                    </div>
                    <div class="flex items-baseline space-x-2">
                        <span id="scoreValue" class="text-5xl font-bold"></span>
                        <span class="text-2xl text-slate-500 font-semibold">/100</span>
                    </div>
                </div>

                <!-- Vulnerabilities Section -->
                <div class="mb-8">
                    <h3 class="text-lg font-bold text-slate-900 mb-4">Vulnerabilities Found</h3>
                    <div id="vulnerabilitiesList" class="space-y-3">
                        <!-- Vulnerabilities will be inserted here -->
                    </div>
                </div>

                <!-- Security Hardening Button -->
                <div id="hardeningButtonContainer" class="hidden">
                    <a 
                        id="hardeningButton"
                        class="inline-block w-full text-center bg-amber-500 hover:bg-amber-600 text-white font-semibold py-3 rounded-lg transition duration-200 ease-in-out transform hover:scale-105 active:scale-95"
                    >
                        Request Security Hardening
                    </a>
                </div>
            </div>

            <!-- Error Section -->
            <div id="errorSection" class="hidden bg-white rounded-lg shadow-2xl p-8 md:p-12">
                <div class="space-y-4">
                    <div class="flex items-start space-x-3">
                        <div class="text-red-500 text-xl font-bold">⚠</div>
                        <div>
                            <h3 class="text-lg font-bold text-red-600 mb-1">Audit Failed</h3>
                            <p id="errorMessage" class="text-slate-700"></p>
                        </div>
                    </div>
                    <button 
                        onclick="goBack()"
                        class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-3 rounded-lg transition duration-200"
                    >
                        Try Again
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const domainInput = document.getElementById('domainInput');
        const auditButton = document.getElementById('auditButton');
        const inputSection = document.getElementById('inputSection');
        const loadingSection = document.getElementById('loadingSection');
        const resultsSection = document.getElementById('resultsSection');
        const errorSection = document.getElementById('errorSection');

        // Allow Enter key to trigger audit
        domainInput.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                runAudit();
            }
        });

        async function runAudit() {
    const domainInput = document.getElementById('domainInput'); // Make sure this matches the ID
    const domain = domainInput.value.trim();

    console.log("Domain being sent:", domain); // Check this in the Console tab!

    if (!domain) {
        alert('Please enter a domain');
        return;
    }

            // Show loading state
            inputSection.classList.add('hidden');
            errorSection.classList.add('hidden');
            resultsSection.classList.add('hidden');
            loadingSection.classList.remove('hidden');
            auditButton.disabled = true;

            try {
                const response = await fetch(`/api/index?domain=${encodeURIComponent(domain)}`);

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                displayResults(data, domain);
            } catch (error) {
                displayError(error.message || 'An error occurred while running the audit');
            } finally {
                auditButton.disabled = false;
            }
        }

        function displayResults(data, domain) {
            const score = data.score || 0;
            const vulnerabilities = data.vulnerabilities || [];

            // Update score card with color coding
            const scoreCard = document.getElementById('scoreCard');
            const scoreValue = document.getElementById('scoreValue');
            
            scoreValue.textContent = score;

            if (score >= 80) {
                scoreCard.classList.remove('border-red-300', 'bg-red-50');
                scoreCard.classList.add('border-green-300', 'bg-green-50');
                scoreValue.classList.remove('text-red-600');
                scoreValue.classList.add('text-green-600');
            } else {
                scoreCard.classList.remove('border-green-300', 'bg-green-50');
                scoreCard.classList.add('border-red-300', 'bg-red-50');
                scoreValue.classList.remove('text-green-600');
                scoreValue.classList.add('text-red-600');
            }

            // Display vulnerabilities
            const vulnerabilitiesList = document.getElementById('vulnerabilitiesList');
            vulnerabilitiesList.innerHTML = '';

            if (vulnerabilities.length === 0) {
                vulnerabilitiesList.innerHTML = '<p class="text-slate-600 italic">No vulnerabilities detected</p>';
            } else {
                vulnerabilities.forEach((vuln) => {
                    const vulnElement = document.createElement('div');
                    vulnElement.className = 'p-4 bg-slate-50 rounded-lg border border-slate-200';
                    vulnElement.innerHTML = `
                        <h4 class="font-semibold text-slate-900 mb-1">${escapeHtml(vuln.name || 'Unknown Vulnerability')}</h4>
                        <p class="text-sm text-slate-600">${escapeHtml(vuln.description || 'No description available')}</p>
                    `;
                    vulnerabilitiesList.appendChild(vulnElement);
                });
            }

            // Show/hide hardening button
            const hardeningButtonContainer = document.getElementById('hardeningButtonContainer');
            const hardeningButton = document.getElementById('hardeningButton');

            if (score < 80) {
                hardeningButtonContainer.classList.remove('hidden');
                const mailtoLink = `mailto:?subject=${encodeURIComponent(`Fix Website Security: ${domain}`)}`;
                hardeningButton.href = mailtoLink;
            } else {
                hardeningButtonContainer.classList.add('hidden');
            }

            // Show results section
            loadingSection.classList.add('hidden');
            resultsSection.classList.remove('hidden');
        }

        function displayError(message) {
            document.getElementById('errorMessage').textContent = message;
            loadingSection.classList.add('hidden');
            errorSection.classList.remove('hidden');
        }

        function goBack() {
            domainInput.value = '';
            inputSection.classList.remove('hidden');
            errorSection.classList.add('hidden');
            resultsSection.classList.add('hidden');
            loadingSection.classList.add('hidden');
            domainInput.focus();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // Focus input on load
        domainInput.focus();
    </script>
</body>
</html>
